name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate Top Languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Convert SVG to PNG
        run: |
          rsvg-convert -w 467 -h 195 profile/stats.svg -o profile/stats.png
          rsvg-convert -w 300 -h 165 profile/top-langs.svg -o profile/top-langs.png

      - name: Commit generated cards
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add profile/*.svg profile/*.png

          git commit -m "Update GitHub stats" || exit 0

          git push